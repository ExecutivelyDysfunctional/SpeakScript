name: Build APK (Balanced Hybrid)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Diagnostic level for this run'
        required: false
        type: choice
        default: normal
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message || '', '[build-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DISPATCH_DIAGNOSTICS: ${{ inputs.diagnostics || 'normal' }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;${BUILD_TOOLS_VERSION}"
          )

          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Android SDK installation failed."
              echo "Retrying in 10 seconds: attempt $((attempt + 1))/3..."
              sleep 10
            fi
          done

          echo "Android SDK installation failed after 3 attempts."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Select build diagnostics mode
        id: build_mode
        shell: bash
        run: |
          set -euo pipefail

          mode="$DISPATCH_DIAGNOSTICS"

          if printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[build-apk-debug]'; then
            mode="debug"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[build-apk-verbose]'; then
            mode="verbose"
          fi

          case "$mode" in
            normal)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
              )
              ;;

            verbose)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
                --info
              )
              ;;

            debug)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
                --info
                --debug
              )
              ;;

            *)
              echo "Unknown diagnostics mode: $mode"
              echo "Valid modes are: normal, verbose, debug"
              exit 1
              ;;
          esac

          {
            echo "mode=$mode"
            printf 'args='
            printf '%q ' "${gradle_args[@]}"
            printf '\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "Gradle diagnostics mode: ${{ steps.build_mode.outputs.mode }}"
          echo "Gradle arguments: ${{ steps.build_mode.outputs.args }}"

          ./gradlew \
            ${{ steps.build_mode.outputs.args }} \
            2>&1 | tee build-output.log

      - name: Verify APK was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apk_files=(app/build/outputs/apk/debug/*.apk)

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No debug APK was produced."
            exit 1
          fi

          printf 'Produced APK: %s\n' "${apk_files[@]}"

      - name: Read APK version
        id: apk_metadata
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          apk_files=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No debug APK was found."
            exit 1
          fi

          apk="${apk_files[0]}"
          aapt="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt"

          if [ ! -x "$aapt" ]; then
            echo "aapt was not found at: $aapt"
            exit 1
          fi

          badging="$("$aapt" dump badging "$apk")"

          version_name="$(
            printf '%s\n' "$badging" |
              sed -n "s/.*versionName='\([^']*\)'.*/\1/p" |
              head -n 1
          )"

          version_code="$(
            printf '%s\n' "$badging" |
              sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" |
              head -n 1
          )"

          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Could not read version information from APK."
            echo "$badging"
            exit 1
          fi

          safe_version_name="$(
            printf '%s' "$version_name" |
              sed 's/[^A-Za-z0-9._-]/-/g'
          )"

          artifact_name="${REPOSITORY_NAME}-v${safe_version_name}-code${version_code}-build${GITHUB_RUN_NUMBER}-debug-apk"

          echo "APK: $apk"
          echo "Version name: $version_name"
          echo "Version code: $version_code"
          echo "Artifact name: $artifact_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_metadata.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e

          {
            echo '=== Workflow context ==='
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Run number: $GITHUB_RUN_NUMBER"
            echo "Diagnostics mode: ${{ steps.build_mode.outputs.mode }}"

            echo
            echo '=== Java version ==='
            java -version

            echo
            echo '=== Gradle version ==='
            ./gradlew --version

            echo
            echo '=== Android SDK environment ==='
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            echo "JAVA_HOME=${JAVA_HOME:-}"

            echo
            echo '=== Installed Android SDK packages ==='
            sdkmanager --list_installed 2>/dev/null | tail -n 120

            echo
            echo '=== Relevant project files ==='
            find . -maxdepth 3 \
              \( -path './.git' -o -path './.gradle' -o -path './build' -o -path './app/build' \) \
              -prune -o \
              -type f \
              -print |
              sort |
              head -n 300

            echo
            echo '=== Build outputs ==='
            find app/build -maxdepth 6 -type f 2>/dev/null |
              sort |
              head -n 300

            echo
            echo '=== Build directory sizes ==='
            du -sh .gradle app/build 2>/dev/null
          } | tee diagnostics.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-build-${{ github.run_number }}-diagnostics
          path: |
            build-output.log
            diagnostics.txt
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
