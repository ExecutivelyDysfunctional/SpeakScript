name: Build APK (Fast + Resilient)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message || '', '[build-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
          )

          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Android SDK installation failed; retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Android SDK installation failed after 3 attempts."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apk_files=(app/build/outputs/apk/debug/*.apk)

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No debug APK was produced."
            exit 1
          fi

          printf 'Produced APK: %s\n' "${apk_files[@]}"

      - name: Read APK version
        id: apk_metadata
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          apk_files=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No debug APK was found."
            exit 1
          fi

          apk="${apk_files[0]}"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [ ! -x "$aapt" ]; then
            echo "aapt was not found at: $aapt"
            exit 1
          fi

          badging="$("$aapt" dump badging "$apk")"

          version_name="$(
            printf '%s\n' "$badging" |
              sed -n "s/.*versionName='\([^']*\)'.*/\1/p" |
              head -n 1
          )"

          version_code="$(
            printf '%s\n' "$badging" |
              sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" |
              head -n 1
          )"

          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Could not read version information from APK."
            echo "$badging"
            exit 1
          fi

          safe_version_name="$(
            printf '%s' "$version_name" |
              sed 's/[^A-Za-z0-9._-]/-/g'
          )"

          artifact_name="${REPOSITORY_NAME}-v${safe_version_name}-code${version_code}-build${GITHUB_RUN_NUMBER}-debug-apk"

          echo "APK: $apk"
          echo "Version name: $version_name"
          echo "Version code: $version_code"
          echo "Artifact name: $artifact_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_metadata.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Collect concise diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '=== Java version ==='
          java -version
          echo '=== Gradle version ==='
          ./gradlew --version
          echo '=== Android SDK environment ==='
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo '=== Installed SDK packages ==='
          sdkmanager --list_installed 2>/dev/null | tail -n 80
          echo '=== Build outputs ==='
          find app/build -maxdepth 5 -type f 2>/dev/null | sort | head -n 200
