name: Build Android APK

on:
  push:
    branches:
      - 'main'
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Diagnostic verbosity level'
        required: false
        type: choice
        default: normal
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DISPATCH_DIAGNOSTICS: ${{ inputs.diagnostics || 'normal' }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and configure platform components
        shell: bash
        run: |
          set -euo pipefail
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null || true
          echo "Ensuring platform tools and platforms are up to date..."
          sdkmanager "platform-tools" "platforms;android-36" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Keystore and Environment Secrets
        shell: bash
        run: |
          set -euo pipefail
          # Decode debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || \
            base64 --decode -i debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # Fallback keystore generation if absent or empty
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          fi

      - name: Ensure Gradle Wrapper exists and is executable
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew || true

      - name: Configure Gradle Build Flags
        id: build_mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$DISPATCH_DIAGNOSTICS"

          if printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[build-apk-debug]'; then
            mode="debug"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[build-apk-verbose]'; then
            mode="verbose"
          fi

          case "$mode" in
            normal)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
              )
              ;;
            verbose)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
                --info
              )
              ;;
            debug)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
                --info
                --debug
              )
              ;;
            *)
              echo "Unknown diagnostics mode: $mode"
              exit 1
              ;;
          esac

          {
            echo "mode=$mode"
            printf 'args='
            printf '%q ' "${gradle_args[@]}"
            printf '\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          echo "Executing Gradle in '${{ steps.build_mode.outputs.mode }}' mode..."
          echo "Command: ./gradlew ${{ steps.build_mode.outputs.args }}"
          ./gradlew ${{ steps.build_mode.outputs.args }} 2>&1 | tee build-output.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "Error: No debug APK was produced."
            exit 1
          fi
          echo "Generated APK: ${apk_files[0]}"

      - name: Read APK metadata and versioning
        id: apk_meta
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name || 'TranscribeAI' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/debug/*.apk)
          apk="${apk_files[0]}"

          version_name="1.0"
          version_code="1"

          # Dynamically locate aapt from any installed build-tools
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$aapt_bin" ] && [ -x "$aapt_bin" ]; then
            badging="$("$aapt_bin" dump badging "$apk" 2>/dev/null || true)"
            parsed_vn="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            parsed_vc="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
            [ -n "$parsed_vn" ] && version_name="$parsed_vn"
            [ -n "$parsed_vc" ] && version_code="$parsed_vc"
          fi

          safe_version_name="$(printf '%s' "$version_name" | sed 's/[^A-Za-z0-9._-]/-/g')"
          artifact_name="${REPO_NAME}-v${safe_version_name}-code${version_code}-build${GITHUB_RUN_NUMBER}-debug-apk"

          echo "Detected version: $version_name (code: $version_code)"
          echo "Artifact name: $artifact_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_meta.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract and Log Failed Section
        if: failure()
        shell: bash
        run: |
          set +e
          echo "::group::❌ FAILING SECTION DETAILS"
          echo "========================================================"
          echo "             BUILD FAILURE SECTION SUMMARY              "
          echo "========================================================"

          # Initialize Step Summary Header
          {
            echo "## ❌ Build APK Failure Summary"
            echo "- **Workflow Run:** #$GITHUB_RUN_NUMBER"
            echo "- **Trigger:** \`$GITHUB_EVENT_NAME\` (\`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA:0:7}\`)"
            echo "- **Diagnostics Mode:** \`${{ steps.build_mode.outputs.mode || 'normal' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Extract failing section from build-output.log
          if [ -f "build-output.log" ]; then
            echo "--- Extracting Gradle failure section ---"
            
            # Primary extraction: "* What went wrong:" block to end of failure notes
            sed -n '/\* What went wrong:/,$p' build-output.log > failure-section.log
            
            # Fallback 1: grep around keywords if structured block is absent
            if [ ! -s "failure-section.log" ]; then
              grep -E -C 5 "(FAILURE:|BUILD FAILED|Execution failed for task|e: |Compilation error|error: )" build-output.log > failure-section.log || true
            fi
            
            # Fallback 2: grab last 80 lines
            if [ ! -s "failure-section.log" ]; then
              tail -n 80 build-output.log > failure-section.log
            fi

            cat failure-section.log

            {
              echo "### 🔍 Specific Failing Section & Error Log"
              echo '```text'
              cat failure-section.log | head -n 120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No build-output.log found. The build failed before Gradle execution." | tee failure-section.log
            {
              echo "### ⚠️ Pre-Build Failure"
              echo "The failure occurred during environment setup before Gradle executed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "========================================================"
          echo "::endgroup::"

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '=== Workflow Execution Context ==='
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Run Number: $GITHUB_RUN_NUMBER"
            echo "Diagnostics Mode: ${{ steps.build_mode.outputs.mode }}"
            echo
            echo '=== Java & Gradle Environment ==='
            java -version
            if [ -f "./gradlew" ]; then
              ./gradlew --version
            fi
            echo
            echo '=== Android SDK Environment ==='
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            sdkmanager --list_installed 2>/dev/null | tail -n 80
            echo
            echo '=== Project Structure & Build Outputs ==='
            find app/build -maxdepth 5 -type f 2>/dev/null | sort | head -n 150
          } | tee diagnostics.txt

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name || 'build' }}-run-${{ github.run_number }}-failure-diagnostics
          path: |
            failure-section.log
            build-output.log
            diagnostics.txt
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14


