name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    # Trigger when the commit message contains [Build-apk] (case-tolerant) or when manually triggered
    if: >
      contains(github.event.head_commit.message, '[Build-apk]') ||
      contains(github.event.head_commit.message, '[build-apk]') ||
      contains(github.event.head_commit.message, '[BUILD-APK]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64"
              base64 -d -i debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
            fi
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-android-template-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
