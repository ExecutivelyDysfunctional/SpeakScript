name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare local build files
        shell: bash
        run: |
          set -euo pipefail

          # Ensure the .env file exists for the Secrets Gradle Plugin.
          # If .env doesn't exist, use .env.example if available, otherwise touch an empty .env.
          if [[ ! -f .env ]]; then
            if [[ -f .env.example ]]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Android's default debug signing configuration is sufficient for
          # assembleDebug. Do not generate or store a release keystore in CI.

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug 2>&1 | tee build-output.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apk_files=(app/build/outputs/apk/debug/*.apk)

          if (( ${#apk_files[@]} == 0 )); then
            echo "::error::The build completed without producing a debug APK."
            exit 1
          fi

          for apk in "${apk_files[@]}"; do
            echo "Generated APK: $apk"
            ls -lh "$apk"
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpeakScript-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpeakScript-build-diagnostics-${{ github.run_number }}
          path: |
            build-output.log
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
