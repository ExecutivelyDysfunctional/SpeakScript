name: Build Android APK

on:
  push:
    branches:
      - 'main'
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Diagnostic verbosity level'
        required: false
        type: choice
        default: normal
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUILD_TOOLS_VERSION: '36.0.0'
      DISPATCH_DIAGNOSTICS: ${{ inputs.diagnostics || 'normal' }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;${BUILD_TOOLS_VERSION}"
          )
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android SDK installation failed; retrying in 10s (attempt $((attempt + 1))/3)..."
              sleep 10
            fi
          done
          echo "Android SDK installation failed after 3 attempts."
          exit 1

      - name: Set up Gradle Action
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment Secrets
        shell: bash
        run: |
          set -euo pipefail
          # Decode debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || \
            base64 --decode -i debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # Fallback keystore generation if absent or empty
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          fi

      - name: Ensure Gradle Wrapper exists and is executable
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Configure Gradle Build Flags
        id: build_mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$DISPATCH_DIAGNOSTICS"

          if printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[build-apk-debug]'; then
            mode="debug"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[build-apk-verbose]'; then
            mode="verbose"
          fi

          case "$mode" in
            normal)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
              )
              ;;
            verbose)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
                --info
              )
              ;;
            debug)
              gradle_args=(
                assembleDebug
                --no-daemon
                --console=plain
                --stacktrace
                --info
                --debug
              )
              ;;
            *)
              echo "Unknown diagnostics mode: $mode"
              exit 1
              ;;
          esac

          {
            echo "mode=$mode"
            printf 'args='
            printf '%q ' "${gradle_args[@]}"
            printf '\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          echo "Executing Gradle in '${{ steps.build_mode.outputs.mode }}' mode..."
          echo "Arguments: ${{ steps.build_mode.outputs.args }}"
          ./gradlew ${{ steps.build_mode.outputs.args }} 2>&1 | tee build-output.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "Error: No debug APK was produced."
            exit 1
          fi
          echo "Generated APK: ${apk_files[0]}"

      - name: Read APK metadata and versioning
        id: apk_meta
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name || 'TranscribeAI' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/debug/*.apk)
          apk="${apk_files[0]}"
          aapt="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt"

          version_name="1.0"
          version_code="1"

          if [ -x "$aapt" ]; then
            badging="$("$aapt" dump badging "$apk" 2>/dev/null || true)"
            parsed_vn="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            parsed_vc="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
            [ -n "$parsed_vn" ] && version_name="$parsed_vn"
            [ -n "$parsed_vc" ] && version_code="$parsed_vc"
          fi

          safe_version_name="$(printf '%s' "$version_name" | sed 's/[^A-Za-z0-9._-]/-/g')"
          artifact_name="${REPO_NAME}-v${safe_version_name}-code${version_code}-build${GITHUB_RUN_NUMBER}-debug-apk"

          echo "Detected version: $version_name (code: $version_code)"
          echo "Artifact name: $artifact_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_meta.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '=== Workflow Execution Context ==='
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Run Number: $GITHUB_RUN_NUMBER"
            echo "Diagnostics Mode: ${{ steps.build_mode.outputs.mode }}"
            echo
            echo '=== Java & Gradle Environment ==='
            java -version
            if [ -f "./gradlew" ]; then
              ./gradlew --version
            fi
            echo
            echo '=== Android SDK Environment ==='
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            sdkmanager --list_installed 2>/dev/null | tail -n 80
            echo
            echo '=== Project Structure & Build Outputs ==='
            find app/build -maxdepth 5 -type f 2>/dev/null | sort | head -n 150
          } | tee diagnostics.txt

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name || 'build' }}-run-${{ github.run_number }}-failure-diagnostics
          path: |
            build-output.log
            diagnostics.txt
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14

